version: '3.8'

services:
  qwen-mtp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qwen-mtp-server
    ports:
      - "8080:8080"
    volumes:
      - ./models:/workspace/models
      - ./cache:/root/.cache
      - ./cache:/root/.cache/huggingface
    environment:
      - HOME=/root
      # GPU/CUDA environment
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
    stdin_open: true
    tty: true
    # GPU support for RTX3090 - usando runtime nvidia
    runtime: nvidia
